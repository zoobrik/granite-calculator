<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading… — Granite Calculator</title>
  <script>
    // GitHub Pages / static-host SPA fallback: this file is served for unknown
    // paths. We forward the original path into a query parameter that index.html
    // then restores via history.replaceState. (See the loader at the top of
    // index.html.)
    (function () {
      var l = window.location;
      l.replace(l.protocol + '//' + l.host + '/?__redirect=' + encodeURIComponent(l.pathname + l.search + l.hash));
    })();
  </script>
</head>
<body></body>
</html>
