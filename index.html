<!-- Async-load both stylesheets via preload-and-swap to remove them from the
     critical render path (PageSpeed Insights recommendation). Browser fetches
     as preload (non-blocking), then the onload handler flips the rel to
     "stylesheet" so the rules apply. <noscript> blocks add the standard
     blocking link for users without JS.
     Geist weights trimmed to 400/500/600 and Geist Mono to 400/500 — the
     other weights (300, 700, mono 600) are never referenced in styles.css. -->
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<link rel="preload" href="/styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
</noscript>
<script>
  // SPA path restore — when 404.html (GitHub Pages-style hosts) bounces an
  // unknown path back here as ?__redirect=..., put that real path back into
  // the URL bar before React mounts. No-op on Cloudflare Pages / Netlify
  // (which serve this index.html directly via _redirects).
  (function () {
    try {
      var p = new URLSearchParams(window.location.search).get('__redirect');
      if (p) window.history.replaceState(null, '', p);
    } catch (e) {}
  })();

  // Theme bootstrap — runs before paint to avoid flash
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = stored || sys;
      var meta = document.querySelector('meta[name="theme-color"]:not([media])');
      if (meta) meta.setAttribute('content', document.documentElement.dataset.theme === 'dark' ? '#1a1a1a' : '#fafaf7');
    } catch (e) {}
  })();
</script>
